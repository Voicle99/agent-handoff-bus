name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Install release build tools
        run: python -m pip install build twine
      - name: Compile
        run: python -m py_compile src/agent_handoff_bus/*.py tests/*.py tools/*.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Check docs links
        run: python tools/docs_link_check.py
      - name: Run maintainer check bundle
        run: python tools/maintainer_check.py
      - name: Build release artifacts
        run: python tools/build_release_artifacts.py --dist-dir dist
